name: Package tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
        dependencies: [base, socp]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create an isolated test environment
        run: |
          python -m venv .venv
          python -c "import os,pathlib; p=pathlib.Path('.venv')/('Scripts' if os.name=='nt' else 'bin'); f=open(os.environ['GITHUB_PATH'],'a'); f.write(str(p.resolve())+os.linesep); f.close()"
      - name: Install base package and plotting tests
        if: matrix.dependencies == 'base'
        run: python -m pip install '.[test-base]'
      - name: Confirm optional solver is absent
        if: matrix.dependencies == 'base'
        run: python -I -c "import importlib.util; assert importlib.util.find_spec('cvxpy') is None"
      - name: Install package and optional conic tests
        if: matrix.dependencies == 'socp'
        run: python -m pip install '.[test]'
      - name: Require the installed package and compiled extension
        run: >-
          python -I -B -c "import importlib.metadata as metadata,json,pathlib,sys,dwd;
          from dwd import _residual_accel, _compiled_residual;
          prefix=pathlib.Path(sys.prefix).resolve(); package=pathlib.Path(dwd.__file__).resolve();
          extension=pathlib.Path(_residual_accel.__file__).resolve();
          assert package.is_relative_to(prefix), package;
          assert extension.parent == package.parent and extension.is_relative_to(prefix), extension;
          assert _compiled_residual._ACCEL is _residual_accel;
          assert dwd.__version__ == metadata.version('dwd');
          print(json.dumps({'python':sys.executable,'package':str(package),'extension':str(extension),'version':dwd.__version__}))"
      - name: Run the complete bundled test suite
        run: python -I -B -m unittest discover -s tests -v
