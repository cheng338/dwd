[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dwd"
authors = [
    {name = 'Iain Carmichael', email = 'idc9@cornell.edu'},
    {name = 'David Allemang', email = 'david.allemang@kitware.com'},
]
maintainers = [
    {name = 'cheng338 (compatibility and audit fork)'}
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>=1.6",
    "threadpoolctl>=3.1",
]
requires-python=">=3.11"
readme = 'README.md'
license = {file = 'LICENSE.txt'}
classifiers = [
    "License :: OSI Approved :: MIT License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",

    "Development Status :: 4 - Beta",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
description = "Distance Weighted Discrimination for Python"
dynamic = ['version']

[project.optional-dependencies]
socp = [
    "cvxpy",
]
test = [
    "cvxpy",
    "matplotlib",
]
test-base = [
    "matplotlib",
]
doc = [
    'sphinx',
    'sphinx-rtd-theme',
]

[project.urls]
Source = 'https://github.com/cheng338/dwd'
Upstream = 'https://github.com/slicersalt/dwd'
Issues = 'https://github.com/cheng338/dwd/issues'

[tool.setuptools.dynamic]
version = {attr = "dwd.__version__"}

[tool.setuptools.packages.find]
include = ["dwd*"]

[tool.setuptools.package-data]
dwd = ["*.c", "CPYTHON-LICENSE.txt"]

[tool.setuptools]
license-files = ["LICENSE.txt", "dwd/CPYTHON-LICENSE.txt"]
