[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dwd"
authors = [
    {name = 'Iain Carmichael', email = 'idc9@cornell.edu'},
    {name = 'David Allemang', email = 'david.allemang@kitware.com'},
]
maintainers = [
    {name = 'Chang Cheng'}
]
dependencies = [
    "joblib>=1.6.0",
    "numpy>=1.26.3",
    "scipy>=1.11.4",
    "scikit-learn>=1.6.1",
    "threadpoolctl>=3.7.0",
]
requires-python=">=3.11"
readme = 'README.md'
license = "MIT AND Python-2.0.1"
license-files = ["LICENSE.txt", "dwd/CPYTHON-LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",

    "Development Status :: 4 - Beta",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
description = "Distance Weighted Discrimination for Python"
dynamic = ['version']

[project.optional-dependencies]
socp = [
    "cvxpy>=1.6.7",
    "clarabel>=0.11.0",
    "osqp>=1.0.4",
    "scs>=3.2.4.post3,!=3.3.0",
    "highspy>=1.7.1",
]
test = [
    "pytest>=9.0.3",
    "pandas>=2.2.0; python_version < '3.13'",
    "pandas>=2.2.3; python_version == '3.13'",
    "pandas>=2.3.3; python_version == '3.14'",
    "pandas>=3.0.6; python_version >= '3.15'",
    "psutil>=7.2.0",
    "cvxpy>=1.6.7",
    "clarabel>=0.11.0",
    "osqp>=1.0.4",
    "scs>=3.2.4.post3,!=3.3.0",
    "highspy>=1.7.1",
    "matplotlib>=3.7.3",
    "setuptools>=77.0.3",
]
test-base = [
    "pytest>=9.0.3",
    "pandas>=2.2.0; python_version < '3.13'",
    "pandas>=2.2.3; python_version == '3.13'",
    "pandas>=2.3.3; python_version == '3.14'",
    "pandas>=3.0.6; python_version >= '3.15'",
    "psutil>=7.2.0",
    "matplotlib>=3.7.3",
    "setuptools>=77.0.3",
]
doc = [
    'sphinx',
    'sphinx-rtd-theme',
]

[project.urls]
Source = 'https://github.com/cheng338/dwd'
Upstream = 'https://github.com/slicersalt/dwd'
Issues = 'https://github.com/cheng338/dwd/issues'

[tool.setuptools.dynamic]
version = {attr = "dwd.__version__"}

[tool.setuptools.packages.find]
include = ["dwd*"]

[tool.setuptools.package-data]
dwd = ["*.c", "CPYTHON-LICENSE.txt"]

