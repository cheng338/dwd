[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "dwd"
authors = [
    {name = 'Iain Carmichael', email = 'idc9@cornell.edu'},
    {name = 'David Allemang', email = 'david.allemang@kitware.com'},
]
maintainers = [
    {name = 'cheng338 (compatibility and audit fork)'}
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>=1.6",
]
requires-python=">=3.11"
readme = 'README.md'
license = {file = 'LICENSE.txt'}
classifiers = [
    "License :: OSI Approved :: MIT License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",

    "Development Status :: 4 - Beta",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dynamic = ['version', 'description']

[project.optional-dependencies]
socp = [
    "cvxpy",
]
test = [
    "cvxpy",
    "matplotlib",
]
doc = [
    'sphinx',
    'sphinx-rtd-theme',
]

[project.urls]
Source = 'https://github.com/cheng338/dwd'
Upstream = 'https://github.com/slicersalt/dwd'
Issues = 'https://github.com/cheng338/dwd/issues'

[tool.flit.sdist]
include = [
    "tests/",
    "doc/",
    "docs/",
    "*.md",
    "LICENSE.txt",
    "MANIFEST.in",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
    "build/",
    "dist/",
]
